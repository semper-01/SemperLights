name: Test and deploy Semper Lights

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the selected main-branch commit to production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

  frontend-tests:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.example.invalid/api/v1
        run: npm run build

  deployment-workflow-tests:
    name: Deployment workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check deployment workflow invariants
        run: node --test .github/workflows/tests/*.test.mjs

  release:
    name: Build, publish, and deploy production images
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
    needs:
      - backend-tests
      - frontend-tests
      - deployment-workflow-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: semperlights-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      ACR_NAME: semperlightsregistry
      ACR_SERVER: semperlightsregistry.azurecr.io
      BACKEND_APP: semperlights-backend
      FRONTEND_APP: semperlights-frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production releases must run from the main branch."
            exit 1
          fi

          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP VITE_API_BASE_URL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required GitHub Actions variable $name is not configured."
              exit 1
            fi
          done

          if [[ ! "$VITE_API_BASE_URL" =~ ^https://[^/]+/api/v1/?$ ]]; then
            echo "::error::VITE_API_BASE_URL must be the HTTPS production API base ending in /api/v1."
            exit 1
          fi

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Container Apps and durable media prerequisites
        shell: bash
        run: |
          set -euo pipefail

          MEDIA_URL="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query "properties.template.containers[0].env[?name=='MEDIA_URL'].value | [0]" \
            --output tsv)"
          if [[ -z "$MEDIA_URL" || "$MEDIA_URL" == "None" || ! "$MEDIA_URL" =~ ^https://[^/]+/media/$ ]]; then
            echo "::error::The backend must have an absolute HTTPS MEDIA_URL ending in /media/ before release."
            exit 1
          fi

          BACKEND_FQDN="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          BACKEND_INGRESS_EXTERNAL="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query properties.configuration.ingress.external \
            --output tsv)"
          MEDIA_HOST="${MEDIA_URL#https://}"
          MEDIA_HOST="${MEDIA_HOST%%/*}"
          if [[ "$BACKEND_INGRESS_EXTERNAL" != "true" || -z "$BACKEND_FQDN" || "$MEDIA_HOST" != "$BACKEND_FQDN" ]]; then
            echo "::error::For the current direct-serving design, MEDIA_URL must use the backend app's public ingress host."
            exit 1
          fi

          MEDIA_VOLUME="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query "properties.template.containers[0].volumeMounts[?mountPath=='/app/media'].volumeName | [0]" \
            --output tsv)"
          if [[ -z "$MEDIA_VOLUME" || "$MEDIA_VOLUME" == "None" ]]; then
            echo "::error::The backend must mount durable media storage at /app/media before release."
            exit 1
          fi

          STORAGE_NAME="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query "properties.template.volumes[?name=='${MEDIA_VOLUME}'].storageName | [0]" \
            --output tsv)"
          if [[ -z "$STORAGE_NAME" || "$STORAGE_NAME" == "None" ]]; then
            echo "::error::The backend /app/media volume is not backed by registered Container Apps storage."
            exit 1
          fi

          ENVIRONMENT_ID="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query properties.managedEnvironmentId \
            --output tsv)"
          ENVIRONMENT_NAME="${ENVIRONMENT_ID##*/}"
          ACCESS_MODE="$(az containerapp env storage list \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$ENVIRONMENT_NAME" \
            --query "[?name=='${STORAGE_NAME}'].properties.azureFile.accessMode | [0]" \
            --output tsv)"
          if [[ "$ACCESS_MODE" != "ReadWrite" ]]; then
            echo "::error::The registered media share must use read/write access."
            exit 1
          fi

          echo "Production media URL, backend mount, and read/write storage registration are configured."
          echo "Previous backend image: $(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query properties.template.containers[0].image \
            --output tsv)"
          echo "Previous frontend image: $(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --query properties.template.containers[0].image \
            --output tsv)"

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build and publish backend image
        id: backend-image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.ACR_SERVER }}/semperlights-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend image
        id: frontend-image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_APP_NAME=Semper Lights
          push: true
          tags: ${{ env.ACR_SERVER }}/semperlights-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Deploy images by immutable digest and verify ready revisions
        shell: bash
        env:
          BACKEND_DIGEST: ${{ steps.backend-image.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend-image.outputs.digest }}
        run: |
          set -euo pipefail

          deploy_and_verify() {
            local app="$1"
            local image="$2"
            local latest ready actual attempt

            az containerapp update \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --name "$app" \
              --image "$image" \
              --output none

            for attempt in $(seq 1 36); do
              latest="$(az containerapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app" \
                --query properties.latestRevisionName \
                --output tsv)"
              ready="$(az containerapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app" \
                --query properties.latestReadyRevisionName \
                --output tsv)"
              actual="$(az containerapp show \
                --resource-group "$AZURE_RESOURCE_GROUP" \
                --name "$app" \
                --query properties.template.containers[0].image \
                --output tsv)"

              if [[ "$actual" == "$image" && -n "$latest" && "$latest" == "$ready" ]]; then
                echo "$app deployed to ready revision $latest using $image"
                return 0
              fi
              sleep 10
            done

            echo "::error::Timed out waiting for $app to run the requested image in its latest ready revision."
            return 1
          }

          deploy_and_verify "$BACKEND_APP" \
            "$ACR_SERVER/semperlights-backend@${BACKEND_DIGEST}"
          deploy_and_verify "$FRONTEND_APP" \
            "$ACR_SERVER/semperlights-frontend@${FRONTEND_DIGEST}"

      - name: Smoke-test deployed applications
        shell: bash
        run: |
          set -euo pipefail
          BACKEND_FQDN="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$BACKEND_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          FRONTEND_FQDN="$(az containerapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$FRONTEND_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          curl --fail --silent --show-error --output /dev/null \
            "https://${BACKEND_FQDN}/api/v1/health/"
          curl --fail --silent --show-error --output /dev/null \
            "https://${FRONTEND_FQDN}/"
          echo "Backend health and frontend HTTP smoke checks passed."
