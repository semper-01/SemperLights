# =============================================================================
# Semper Lights — Docker Build & Push to Azure Container Registry
# =============================================================================
#
# Builds and pushes backend and frontend container images to Azure Container
# Registry (ACR) whenever code is pushed to the main branch.
#
# Images are tagged with:
#   - latest
#   - the exact Git commit SHA
#
# This workflow does NOT deploy the application. It only builds and publishes
# container images.
# =============================================================================

name: Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Step 1 — Checkout repository
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Step 2 — Set up Docker Buildx
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Step 3 — Login to Azure Container Registry
      # -----------------------------------------------------------------------
      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: semperlightsregistry.azurecr.io
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      # -----------------------------------------------------------------------
      # Step 4 — Build and push backend image
      # -----------------------------------------------------------------------
      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            semperlightsregistry.azurecr.io/semperlights-backend:latest
            semperlightsregistry.azurecr.io/semperlights-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # Step 5 — Build and push frontend image
      # -----------------------------------------------------------------------
      # The production API base URL is injected at build time from the GitHub
      # Actions repository variable `VITE_API_BASE_URL` (set in
      # Repo → Settings → Secrets and variables → Actions → Variables).
      # Vite bakes VITE_* variables into the bundle, so it must be present at
      # image build time — a runtime env var on an already-built static bundle
      # is NOT reflected. Keep the value in the repo variable so it is not
      # hard-coded into React/TypeScript source.
      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_APP_NAME=Semper Lights
          push: true
          tags: |
            semperlightsregistry.azurecr.io/semperlights-frontend:latest
            semperlightsregistry.azurecr.io/semperlights-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max